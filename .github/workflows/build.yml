name: Build and release
on:
  push:
    branches: [arena/a8f8ad07-pepe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: pepe-neoforge-26.3
          path: build/libs/pepe-*.jar
      - name: Publish verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pepe-1.0.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/libs/pepe-1.0.0.jar --target "$GITHUB_SHA" --title "Pepe Auto Sell 1.0.0 (build ${GITHUB_RUN_NUMBER})" --notes-file RELEASE_NOTES.md
