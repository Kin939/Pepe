name: Build and release
on:
  push:
    branches: [arena/a8f8ad07-pepe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon build 2>&1 | tee build-output.log
      - name: Report build diagnostics
        if: failure()
        run: |
          ./gradlew --no-daemon inspectMinecraftApi >> build-output.log 2>&1 || true
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('build-output.log')
          text = p.read_text()[-45000:] if p.exists() else 'Build log unavailable'
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle diagnostics::' + text)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: pepe-neoforge-26.3
          path: build/libs/pepe-*.jar
      - name: Publish verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          TAG="pepe-${VERSION}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "build/libs/pepe-${VERSION}.jar" --target "$GITHUB_SHA" --title "Pepe Auto Sell ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes-file RELEASE_NOTES.md
