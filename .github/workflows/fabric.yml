name: Fabric build and release
on:
  push:
    branches: [arena/a8f8ad07-pepe]
    paths: ['fabric/**', 'src/**', '.github/workflows/fabric.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test Fabric
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon build 2>&1 | tee build-output.log
      - name: Install virtual display for real client startup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64 libxrandr2 libxinerama1 libxcursor1 libxi6
      - name: Start Minecraft with Fabric Loader 0.19.5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          set -o pipefail
          mkdir -p run-smoke
          printf 'onboardAccessibility:false\n' > run-smoke/options.txt
          timeout 300s xvfb-run -a ./gradlew --no-daemon runSmoke 2>&1 | tee smoke-output.log
          test -f run-smoke/pepe-smoke-ok
      - name: Diagnostics
        if: failure()
        run: |
          tail -150 build-output.log || true
          tail -150 smoke-output.log || true
          python3 - <<'PYTHON'
          from pathlib import Path
          for name in ['build-output.log', 'smoke-output.log', 'run-smoke/logs/latest.log']:
              p = Path(name)
              if p.exists():
                  text = p.read_text(errors='replace')[-24000:]
                  print('::error title=' + name + '::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-build-and-diagnostics
          path: |
            fabric/build/libs/*.jar
            fabric/build/test-results/**/*.xml
            fabric/*-output.log
            fabric/run-smoke/logs/latest.log
            fabric/run-smoke/crash-reports/*.txt
      - name: Publish Fabric JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          gh release create "pepe-fabric-${VERSION}-build-${GITHUB_RUN_NUMBER}" "build/libs/pepe-fabric-${VERSION}.jar" --target "$GITHUB_SHA" --title "Pepe ${VERSION} — Fabric 26.3 / Loader 0.19.5" --notes-file RELEASE_NOTES.md
